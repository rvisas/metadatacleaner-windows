variables:
  APP_ID: io.gitlab.metadatacleaner.metadatacleaner
  MANIFEST: build-aux/io.gitlab.metadatacleaner.metadatacleaner.json

workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check
  - build
  - bundle

.python:
  image: python:latest
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: python
    paths:
      - .cache/pip
      - venv/
  before_script:
    - python -V
    - pip install virtualenv
    - virtualenv venv
    - source venv/bin/activate

pre-commit:
  extends: .python
  interruptible: true
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  script:
    - pip install pre-commit --quiet
    - pre-commit run --all-files

# Needs GITLAB_TOKEN, a masked project access token with the api and
# write_repository scopes, to push the sync branch and open its merge request.
flathub-manifest-sync:
  stage: check
  interruptible: true
  image: python:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    GIT_DEPTH: "0"
    FLATHUB_REPO: https://github.com/flathub/io.gitlab.metadatacleaner.metadatacleaner.git
    SYNC_BRANCH: flathub-manifest-sync
  before_script:
    - pip install pyyaml --quiet
  script:
    - git checkout -B $CI_DEFAULT_BRANCH
    - git config user.name "flathub-manifest-sync"
    - git config user.email "flathub-manifest-sync@noreply.gitlab.com"
    - BEFORE=$(git rev-parse HEAD)
    - 'git subtree pull --prefix=build-aux/flathub-manifest $FLATHUB_REPO master --squash -m "flatpak: Sync flathub manifest"'
    - |
      if [ "$(git rev-parse HEAD)" = "$BEFORE" ]; then
        echo "No changes from flathub"
        exit 0
      fi
    # Keep the generated manifest in the commit that vendors the manifest it comes from.
    - python3 build-aux/generate-manifest.py
    - git commit --all --amend --no-edit
    - git branch -f $SYNC_BRANCH HEAD
    - |
      # Update the merge request still open from a previous sync, if any, instead of
      # opening a new one on every schedule tick.
      OPEN_MRS=$(
        curl --silent --show-error --fail \
          --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests?state=opened&source_branch=$SYNC_BRANCH" \
        | python3 -c "import json, sys; print(len(json.load(sys.stdin)))"
      )
      if [ "$OPEN_MRS" -gt 0 ]; then
        echo "Updating the merge request already open for $SYNC_BRANCH"
        set --
      else
        set -- -o merge_request.create \
          -o merge_request.target=$CI_DEFAULT_BRANCH \
          -o merge_request.remove_source_branch \
          -o merge_request.title="flatpak: Sync flathub manifest" \
          -o merge_request.description="Opened by the scheduled flathub-manifest-sync job. Merge it without squashing: git subtree locates the previous sync point through the git-subtree-split trailer of the vendored commit, and squashing drops it."
      fi
      git push --force "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$SYNC_BRANCH" "$@"

flatpak-repo:
  stage: build
  interruptible: true
  needs:
    - job: pre-commit
      optional: true
  image: fedora:latest
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
  cache:
    - key: flatpak-repo
      paths:
        - .flatpak-builder
  before_script:
    - dnf install --setopt=install_weak_deps=False --nodocs -y flatpak flatpak-builder git python3-pyyaml
  script:
    - python3 build-aux/generate-manifest.py
    - flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
    - flatpak-builder --install-deps-from=flathub --repo=repo --default-branch=$CI_COMMIT_REF_SLUG --ccache --disable-rofiles-fuse builddir $MANIFEST
  artifacts:
    name: $CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG-flatpak-repo
    paths:
      - repo
    expire_in: 1 day

debug:
  stage: bundle
  interruptible: true
  needs:
    - job: flatpak-repo
      artifacts: true
  image: freedesktopsdk/flatpak:latest
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
  script:
    - flatpak build-bundle --runtime ./repo $APP_ID.Debug.flatpak $APP_ID.Debug $CI_COMMIT_REF_SLUG
  artifacts:
    name: $CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG-flatpak-debug
    expose_as: Flatpak debug symbols
    paths:
      - io.gitlab.metadatacleaner.metadatacleaner.Debug.flatpak
