name: Release

on:
  push:
    tags:
      - "v*-windows"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix (for example 4.0.1.1)"
        required: true
        default: "4.0.1.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } elseif ("${{ github.ref_name }}" -match '^v(?<version>\d+\.\d+\.\d+(?:\.\d+)?)-windows$') {
            $version = $Matches['version']
          } else {
            throw "Tag must look like v4.0.1.1-windows"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            throw "Version must have three or four numeric components: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version-windows" >> $env:GITHUB_OUTPUT

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            meson ninja gettext pkgconf glib2 glib2-devel libxml2 patch
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-python-mutagen
            mingw-w64-ucrt-x86_64-poppler
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-gdk-pixbuf2
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-appstream
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            mingw-w64-ucrt-x86_64-shared-mime-info
            mingw-w64-ucrt-x86_64-desktop-file-utils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja

      - name: Run tests
        shell: msys2 {0}
        run: python -m unittest discover -s tests -v

      - name: Build payload
        shell: msys2 {0}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          export BUILD_ROOT="$(cygpath -u "$RUNNER_TEMP")/metadata-cleaner-build"
          bash ./scripts/build-windows.sh

      - name: Smoke test the built folder import
        shell: msys2 {0}
        env:
          MC_PAYLOAD_DIR: ${{ runner.temp }}\metadata-cleaner-build\payload
        run: |
          PAYLOAD_WIN="$(cygpath -m "$MC_PAYLOAD_DIR")"
          PAYLOAD_POSIX="$(cygpath -u "$MC_PAYLOAD_DIR")"
          export PATH="$PAYLOAD_POSIX/runtime/bin:$PAYLOAD_POSIX/tools/exiftool:$PAYLOAD_POSIX/tools/ffmpeg:$PATH"
          export XDG_DATA_DIRS="$PAYLOAD_WIN/share;$PAYLOAD_WIN/runtime/share"
          export GSETTINGS_SCHEMA_DIR="$PAYLOAD_WIN/runtime/share/glib-2.0/schemas"
          export GI_TYPELIB_PATH="$PAYLOAD_WIN/runtime/lib/girepository-1.0"
          python -m unittest tests.test_runtime_folder tests.test_runtime_lightweight -v

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found after installing Inno Setup"
          }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build installer and checksums
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $build = Join-Path $env:RUNNER_TEMP "metadata-cleaner-build"
          $payload = Join-Path $build "payload"
          $output = Join-Path $build "installer"
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          & $env:ISCC "/DAppVersion=$env:VERSION" "/DPayloadDir=$payload" "/DOutputDir=$output" installer\metadatacleaner.iss
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC failed with exit code $LASTEXITCODE"
          }

          $asset = Get-ChildItem (Join-Path $output "*.exe") | Select-Object -First 1
          if (-not $asset) {
            throw "No installer was produced in $output"
          }
          $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLower()
          $line = "$hash  $($asset.Name)"
          $sidecar = "$($asset.FullName).sha256"
          $checksums = Join-Path $output "SHA256SUMS.txt"
          Set-Content -LiteralPath $sidecar -Value $line -Encoding ascii
          Set-Content -LiteralPath $checksums -Value $line -Encoding ascii

          "ASSET=$($asset.FullName)" >> $env:GITHUB_ENV
          "ASSET_NAME=$($asset.Name)" >> $env:GITHUB_ENV
          "ASSET_SHA256=$hash" >> $env:GITHUB_ENV
          "ASSET_SIDECAR=$sidecar" >> $env:GITHUB_ENV
          "ASSET_CHECKSUMS=$checksums" >> $env:GITHUB_ENV

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.version }}-windows
          prerelease: true
          generate_release_notes: true
          body: |
            Unofficial Windows port of Metadata Cleaner ${{ steps.version.outputs.version }}.

            This build is **unsigned** while a code-signing provider is being
            arranged, so Windows SmartScreen may warn on first launch. See the
            repository's code-signing documentation for the current status.

            Verify the download before running it:

            ```powershell
            Get-FileHash .\${{ env.ASSET_NAME }} -Algorithm SHA256
            ```

            The expected SHA-256 is in `${{ env.ASSET_NAME }}.sha256` and in
            `SHA256SUMS.txt`.
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SIDECAR }}
            ${{ env.ASSET_CHECKSUMS }}
